# ==========================================================================
# Predictron CI
#
# Jobs
#   1. code_quality  - Python (autoflake, black) and Prettier formatting gate
#   2. backend       - Node API: Prisma client, lint, Vitest suite, build
#   3. ai-inference  - FastAPI inference service: compile, import check, Pytest
#   4. frontend      - React app: lint and production build
#   5. blockchain    - Solidity contracts: Hardhat compile and test
#
# Every job except code_quality waits for it, so formatting problems fail the
# run fast before any dependencies are installed.
# ==========================================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1 -- Code Quality Checks (Python & Prettier)
  # ============================================================
  code_quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pinned so a new Black release cannot change formatting under our feet.
      - name: Install Python formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install autoflake black==25.11.0

      # Covers the AI services (code/ai_services); no files are modified.
      - name: Check Python Code Quality
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Running autoflake check ==="
          autoflake --remove-all-unused-imports --remove-unused-variables --recursive --check .
          echo "=== Running black check ==="
          black . --check

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The Solidity plugin lets Prettier check the .sol contracts too.
      - name: Install Global Formatters
        run: npm install -g prettier prettier-plugin-solidity

      - name: Run Global Prettier Check
        shell: bash
        run: |
          set -euo pipefail
          NODE_GLOBAL=$(npm root -g)
          echo "=== Running Prettier check ==="
          prettier --plugin="$NODE_GLOBAL/prettier-plugin-solidity/dist/index.js" \
            --check "**/*.{js,jsx,ts,tsx,json,html,css,md,sol,yml,yaml}"

  # ============================================================
  # Job 2 -- Backend Test & Build (Node / Prisma / Vitest)
  # ============================================================
  backend:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: code/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: code/backend/package-lock.json

      # npm ci installs exactly what package-lock.json pins.
      - name: Install dependencies
        run: npm ci

      # Generating the client only reads prisma/schema.prisma, it never opens a
      # connection, so a placeholder URL is enough.
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"

      - name: Lint backend
        run: npm run lint

      # Vitest suite (auth middleware, event indexer, leaderboard). It needs no
      # database or blockchain node.
      - name: Run backend test suite
        run: npm test

      - name: Build backend
        run: npm run build

  # ============================================================
  # Job 3 -- AI Inference Test & Validation (Pytest + coverage)
  # ============================================================
  ai-inference:
    name: AI Inference Test & Validation
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 45

    defaults:
      run:
        working-directory: code/ai_services/inference_api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            code/ai_services/inference_api/requirements.txt
            code/ai_services/inference_api/requirements-dev.txt

      # requirements-dev.txt extends requirements.txt with pytest and httpx
      # (needed by the FastAPI TestClient).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt
          python -m pip install pytest-cov

      # Also compiles the price-direction training scripts, which have no tests.
      - name: Byte-compile inference API and training sources
        run: |
          set -euo pipefail
          python -m compileall -q .
          python -m compileall -q ../model_training

      # Catches missing dependencies and broken imports in the app, and checks
      # the health endpoint is still registered.
      - name: Verify inference API imports cleanly
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib

          for module in ("schemas", "routers.price_direction", "routers.risk_signals", "main"):
              importlib.import_module(module)
              print(f"OK   {module}")

          from main import app

          paths = sorted(app.openapi()["paths"])
          assert "/health" in paths, paths
          print(f"inference API imports cleanly ({len(paths)} endpoints)")
          PY

      # conftest.py puts this directory on sys.path, so the tests import the
      # app modules directly.
      - name: Run inference API test suite
        run: |
          set -euo pipefail
          pytest tests/ \
            --cov=main \
            --cov=schemas \
            --cov=routers \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml

      - name: Upload inference API coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-inference-coverage-report
          path: code/ai_services/inference_api/coverage.xml
          if-no-files-found: ignore
          retention-days: 30

  # ============================================================
  # Job 4 -- Frontend Lint & Build
  # ============================================================
  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      # The build script runs the TypeScript project build (tsc -b) before Vite,
      # so type errors fail this step.
      - name: Build frontend
        run: npm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ============================================================
  # Job 5 -- Smart Contracts Compile & Test (Hardhat)
  # ============================================================
  blockchain:
    name: Smart Contracts Compile & Test
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: code/blockchain

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: code/blockchain/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      # Covers PredictionGame, StakingVault and ReferralRegistry.
      - name: Run contract test suite
        run: npx hardhat test

      # Kept even when the tests fail, so the compiled ABIs can be inspected.
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockchain-build-artifacts
          path: code/blockchain/artifacts/
          if-no-files-found: ignore
          retention-days: 7
